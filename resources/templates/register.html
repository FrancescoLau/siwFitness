<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrazione - Fitness App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="auth-header"> 
        <div class="auth-header-content">
            <div>
                <a th:href="@{/}" class="logo">🏋️ Fitness App</a>
            </div>
            <div class="auth-menu">
                <a th:href="@{/login}" class="btn btn-secondary">Accesso</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>📝 Crea il tuo Account</h1>
            <p>Registrati per iniziare a tracciare i tuoi allenamenti personalizzati</p>
        </div>
        
        <div class="form-container">
			<form th:action="@{/register}" method="post">
			    
			    <div class="form-group">
			        <label for="nome">Nome</label>
			        <input type="text" id="nome" name="nome" th:value="${user?.nome}" placeholder="Inserisci il tuo nome">
			        <span th:if="${#fields.hasErrors('user.nome')}" th:errors="${user.nome}" class="alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
			    </div>
			    
			    <div class="form-group">
			        <label for="cognome">Cognome</label>
			        <input type="text" id="cognome" name="cognome" th:value="${user?.cognome}" placeholder="Inserisci il tuo cognome">
			        <span th:if="${#fields.hasErrors('user.cognome')}" th:errors="${user.cognome}" class="alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
			    </div>
			    
			    <div class="form-group">
			        <label for="email">Email</label>
			        <input type="email" id="email" name="email" th:value="${user?.email}" placeholder="esempio@email.com">
			        <span th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}" class="alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
			    </div>
			    
			    <div class="form-group">
			        <label for="username">Username</label>
			        <input type="text" id="username" name="username" th:value="${credentials?.username}" placeholder="Scegli un username unico">
			        <span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}" class="alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
			    </div>
			    
			    <div class="form-group">
			        <label for="password">Password</label>
			        <input type="password" id="password" name="password" placeholder="Inserisci la tua password">
			    </div>

			    <div class="form-group">
			        <label for="confirmPassword">Conferma Password</label>
			        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ripeti la password scelta">
			    </div>
				<span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}" class="alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
			    
			    <div class="form-actions">
			        <button type="submit" class="btn" style="width: 100%;">🚀 Registrati</button>
			    </div>
			</form>
            
            <div class="navigation-centered" style="margin-top: 30px; font-size: 14px;">
                <p style="color: #718096; margin-bottom: 10px;">
                    Hai già un account? <a th:href="@{/login}" class="admin-link-highlight" style="text-decoration: none;">Accedi qui</a>
                </p>
                <p style="margin: 0;">
                    <a th:href="@{/}" class="admin-link-highlight" style="text-decoration: none;">🏠 Torna alla Home</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
