<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Errore Immagine - Fitness App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="margin-top: 50px;">
        <div class="header header-danger">
            <h1>❌ Errore Caricamento Immagine</h1>
            <p>Si è verificato un problema durante la gestione dell'immagine.</p>
        </div>

        <div class="form-container" style="text-align: center;">
            <div class="alert alert-danger" style="margin-bottom: 25px;">
                <p th:text="${errorMessage ?: 'Errore sconosciuto durante il caricamento del file.'}">Messaggio Errore</p>
            </div>

            <div class="navigation">
                <a href="javascript:history.back()" class="btn btn-warning">⬅️ Torna Indietro e Riprova</a>
                <a th:href="@{/}" class="btn btn-secondary">🏠 Torna alla Home</a>
            </div>
        </div>
    </div>
</body>
</html>
