<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Allenamento Consigliato - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="auth-header"> 
        <div class="auth-header-content">
            <div>
                <a th:href="@{/}" class="logo">🏋️ Fitness App</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="auth-menu">
                <span class="user-welcome-text">Pannello Amministratore</span>
                <a th:href="@{/allenamentiConsigliati}" class="btn btn-secondary">📋 Tutti gli Allenamenti</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-secondary">🚪 Logout</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header header-warning">
            <h1>✏️ Modifica Allenamento Consigliato</h1>
            <p th:text="'Modifica in corso: ' + ${allenamento.nome}">Modifica allenamento consigliato</p>
        </div>
        
        <div class="form-container">
            <!-- Messaggio d'errore globale -->
            <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: 20px;">
                <span th:text="${errorMessage}">Errore durante il caricamento</span>
            </div>

            <form th:action="@{'/admin/editAllenamentoConsigliato/' + ${allenamento.id}}" 
                  th:object="${allenamento}" 
                  method="post" 
                  enctype="multipart/form-data">
                
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{isPubblico}" />
                
                <div class="form-group">
                    <label for="nome">🏷️ Nome Allenamento:</label>
                    <input type="text" id="nome" th:field="*{nome}">
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="alert-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="tipoSport">🏃 Tipo di Sport:</label>
                    <select id="tipoSport" th:field="*{tipoSport}">
                        <option value="">Seleziona un tipo di sport</option>
                        <option value="Cardio">Cardio</option>
                        <option value="Forza">Forza</option>
                        <option value="Yoga">Yoga</option>
                        <option value="Pilates">Pilates</option>
                        <option value="Nuoto">Nuoto</option>
                        <option value="Corsa">Corsa</option>
                        <option value="Ciclismo">Ciclismo</option>
                        <option value="Crossfit">Crossfit</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Altro">Altro</option>
                    </select>
                    <span th:if="${#fields.hasErrors('tipoSport')}" th:errors="*{tipoSport}" class="alert-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="data">📅 Data del Programma:</label>
                    <input type="date" id="data" th:field="*{data}">
                    <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="alert-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="durata">⏱️ Durata:</label>
                    <input type="time" id="durata" th:field="*{durata}">
                    <span th:if="${#fields.hasErrors('durata')}" th:errors="*{durata}" class="alert-danger"></span>
                </div>

                <div class="form-group">
                    <label for="livelloDifficolta">📊 Livello di Difficoltà:</label>
                    <select id="livelloDifficolta" th:field="*{livelloDifficolta}">
                        <option value="">Seleziona il livello</option>
                        <option value="Principiante">Principiante</option>
                        <option value="Intermedio">Intermedio</option>
                        <option value="Avanzato">Avanzato</option>
                    </select>
                    <span th:if="${#fields.hasErrors('livelloDifficolta')}" th:errors="*{livelloDifficolta}" class="alert-danger"></span>
                </div>

                <!-- Sezione Modifica Immagine -->
                <div class="image-section">
                    <label for="imageFile">🖼️ Cambia Immagine (opzionale, max 5MB):</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*">
                    
                    <!-- ERRORE VALIDAZIONE IMMAGINE -->
                    <span th:if="${#fields.hasErrors('immagine')}" th:errors="*{immagine}" class="alert-danger"></span>

                    <div class="image-instructions-box">
                        💡 Seleziona un nuovo file solo se desideri sostituire la copertina attuale (Max 5MB).
                    </div>
                                    
                    <div th:if="${allenamento.immagine != null and allenamento.immagine.url != null}" class="current-image">
                        <p class="review-italic-text">Immagine attualmente in uso:</p>
                        <div class="card-img-container">
                            <img th:src="${allenamento.immagine.url}" alt="Immagine dell'allenamento" />
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="descrizione">📝 Descrizione:</label>
                    <textarea id="descrizione" th:field="*{descrizione}"></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="alert-danger"></span>
                </div>
                
                <div class="navigation">
                    <button type="submit" class="btn btn-warning">💾 Salva Modifiche</button>
                    <a th:href="@{/allenamentiConsigliati}" class="btn btn-secondary">❌ Annulla</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
