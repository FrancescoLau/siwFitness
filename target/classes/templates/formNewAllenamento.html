<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuovo Allenamento - Fitness App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="auth-header"> 
        <div class="auth-header-content">
            <div>
                <a th:href="@{/}" class="logo">🏋️ Fitness App</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="auth-menu">
                <span class="user-welcome-text">👤 Benvenuto, <span sec:authentication="name">Utente</span>!</span>
                <a th:href="@{/allenamenti}" class="btn btn-warning">📋 I Miei Allenamenti</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-secondary">🚪 Logout</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>➕ Nuovo Allenamento</h1>
            <p>Aggiungi una nuova sessione alla tua scheda di allenamento</p>
        </div>
        
        <div class="form-container">
            <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: 20px;">
                <span th:text="${errorMessage}">Errore</span>
            </div>

            <form th:action="@{/saveAllenamento}" 
                  th:object="${allenamento}" 
                  method="post">
                
                <input type="hidden" th:field="*{isPubblico}" />
                
                <div class="form-group">
                    <label for="nome">🏷️ Nome Allenamento:</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Es: Allenamento Gambe e Addominali">
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="alert-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="tipoSport">🏃 Tipo di Sport:</label>
                    <select id="tipoSport" th:field="*{tipoSport}">
                        <option value="">Seleziona un tipo di sport</option>
                        <option value="Cardio">Cardio</option>
                        <option value="Forza">Forza</option>
                        <option value="Yoga">Yoga</option>
                        <option value="Pilates">Pilates</option>
                        <option value="Nuoto">Nuoto</option>
                        <option value="Corsa">Corsa</option>
                        <option value="Ciclismo">Ciclismo</option>
                        <option value="Crossfit">Crossfit</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Altro">Altro</option>
                    </select>
                    <span th:if="${#fields.hasErrors('tipoSport')}" th:errors="*{tipoSport}" class="alert-danger"></span>
                </div>

                <div class="form-group">
                    <label for="data">📅 Data:</label>
                    <input type="date" id="data" th:field="*{data}">
                    <span th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="alert-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="durata">⏱️ Durata:</label>
                    <input type="time" id="durata" th:field="*{durata}">
                    <span th:if="${#fields.hasErrors('durata')}" th:errors="*{durata}" class="alert-danger"></span>
                </div>
                
                <div class="form-group">
                    <label for="descrizione">📝 Descrizione / Note:</label>
                    <textarea id="descrizione" th:field="*{descrizione}" placeholder="Aggiungi note personali, serie o ripetizioni..."></textarea>
                    <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="alert-danger"></span>
                </div>
                
                <div class="navigation">
                    <button type="submit" class="btn btn-warning">💾 Salva Allenamento</button>
                    <a th:href="@{/allenamenti}" class="btn btn-secondary">❌ Annulla</a>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
