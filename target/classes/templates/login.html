<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Fitness App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	
    <div class="auth-header"> 
        <div class="auth-header-content">
            <div>
                <a th:href="@{/}" class="logo">🏋️ Fitness App</a>
            </div>
            <div class="auth-menu">
                <a th:href="@{/register}" class="btn">Registrati</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🏋️ Accedi a Fitness App</h1>
            <p>Inserisci le tue credenziali per tracciare i tuoi allenamenti</p>
        </div>
        
        <div class="form-container">
            <form th:action="@{/login}" method="post">
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" 
                           placeholder="Inserisci il tuo username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" 
                           placeholder="Inserisci la tua password">
                </div>
				<!---- MESSAGGIO DI ERRORE LOGIN -->
				<div th:if="${param.error}">
				<span class="alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;">Username o password non validi.</span>
				</div>
                
                <div class="form-actions">
                    <button type="submit" class="btn" style="width: 50%;">🚀 Accedi</button>
                </div>
            </form>
            
            <div class="navigation-centered" style="margin-top: 30px; font-size: 14px;">
                <p style="color: #718096; margin-bottom: 10px;">
                    Non hai un account? <a th:href="@{/register}" class="admin-link-highlight" style="text-decoration: none;">Registrati qui</a>
                </p>
                <p style="margin: 0;">
                    <a th:href="@{/}" class="admin-link-highlight" style="text-decoration: none;">🏠 Torna alla Home</a>
                </p>
            </div>
        </div>
    </div>
    
</body>
</html>
