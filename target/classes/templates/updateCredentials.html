<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Credenziali - Fitness App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="auth-header"> 
        <div class="auth-header-content">
            <div>
                <a th:href="@{/}" class="logo">🏋️ Fitness App</a>
            </div>
            <div class="auth-menu">
                <a th:href="@{/}" class="btn btn-secondary">🏠 Home</a>
            </div>
        </div>
    </div>

    <div class="container">
        
        <div class="header">
            <h1>🔒 Modifica Credenziali</h1>
            <p>Aggiorna i dati del tuo account confermando in sicurezza la tua identità</p>
        </div>
        
        <div class="form-container">
			<form th:action="@{/updateCredentials}" method="post" th:object="${credentials}">
			    
			    <div class="form-group">
			        <label for="username">Username:</label>
			        <input type="text" id="username" th:field="*{username}" placeholder="Inserisci lo username" >
			        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="alert-danger" ></span>
			    </div>
			    
                <div class="form-group">
                    <label for="oldPassword">Vecchia Password:</label>
                    <input type="password" id="oldPassword" name="oldPassword" placeholder="Inserisci la password attuale per autorizzare la modifica" >
					
                </div>
                
                <div class="form-group">
			        <label for="password">Nuova Password:</label>
			        <input type="password" id="password" th:field="*{password}" placeholder="Lascia vuoto per mantenere la password attuale">
			        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="alert-danger" ></span>
			    </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Conferma Nuova Password:</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Ripeti la nuova password inserita sopra">
                </div>
			    
			    <div class="form-actions">
			        <button type="submit" class="btn" style="width: 100%;">💾 Salva Modifiche</button>
			    </div>
			</form>
            
            <div class="navigation-centered" style="margin-top: 30px; font-size: 14px;">
                <p style="margin: 0;">
                    <a th:href="@{/}" class="admin-link-highlight" style="text-decoration: none;">Annulla e torna alla Home</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
