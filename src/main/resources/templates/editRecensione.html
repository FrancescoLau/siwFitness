<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Recensione - Fitness App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    
    <!-- Navigazione Superiore -->
    <div class="auth-header">
        <div class="auth-header-content">
            <div>
                <a th:href="@{/}" class="logo">🏋️ Fitness App</a>
            </div>
            <div class="auth-menu">
                <span class="user-welcome-text">👤 Benvenuto, <strong sec:authentication="name">Utente</strong></span>
                <a th:href="@{/allenamentiConsigliati}" class="btn btn-secondary">📋 Programmi Consigliati</a>
            </div>
        </div>
    </div>

    <!-- Contenitore Principale -->
    <div class="container">
        
        <!-- Header con stile energetico giallo/arancione (header-warning) per indicare la modifica -->
        <div class="header header-warning">
            <h1>✏️ Modifica la tua Recensione</h1>
            <p th:text="'Aggiorna la tua valutazione per: ' + ${allenamento.nome}">Modifica feedback del programma consigliato</p>
        </div>
        
        <div class="form-container">
            <!-- Form mappato sull'azione POST di modifica nel controller -->
            <form th:action="@{'/recensione/edit/' + ${recensione.id}}" th:object="${recensione}" method="post">
                
                <!-- ID Nascosto per non perdere il riferimento sul database -->
                <input type="hidden" th:field="*{id}" />
                
                <!-- Box d'errore globale del Validator (se necessario) -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>
                
                <!-- Campo Voto -->
                <div class="form-group">
                    <label for="voto">📊 Il tuo Voto (da 1 a 5):</label>
                    <select id="voto" th:field="*{voto}" required>
                        <option value="">Seleziona un punteggio</option>
                        <option value="5">⭐⭐⭐⭐⭐ (Eccellente)</option>
                        <option value="4">⭐⭐⭐⭐ (Buono)</option>
                        <option value="3">⭐⭐⭐ (Sufficiente)</option>
                        <option value="2">⭐⭐ (Scarso)</option>
                        <option value="1">⭐ (Pessimo)</option>
                    </select>
                    <span th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}" class="alert alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
                </div>
                
                <!-- Campo Testo Recensione -->
                <div class="form-group">
                    <label for="testo">📝 Modifica il Commento:</label>
                    <textarea id="testo" th:field="*{testo}" required maxlength="500"
                              placeholder="Aggiorna la tua recensione..."></textarea>
                    <div class="image-instructions-box" style="margin-top: 5px; background-color: #f8f9fa;">
                        💡 Stai modificando un testo già inserito. Massimo 500 caratteri.
                    </div>
                    <span th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}" class="alert alert-danger" style="display:block; margin-top:5px; padding:5px; border-radius:4px;"></span>
                </div>
                
                <!-- Pulsanti di Azione posizionati al centro -->
                <div class="navigation">
                    <button type="submit" class="btn btn-warning">💾 Aggiorna Recensione</button>
                    <a th:href="@{'/allenamentoConsigliato/' + ${allenamento.id} + '/recensioni'}" class="btn btn-secondary">❌ Annulla</a>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
